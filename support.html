<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support von ShadowTracks.com</title>
    <link rel="stylesheet" href="css/sup.css">
</head>
<body>
    <h1>Support von ShadowTracks.com</h1>
    <p>Wenn Sie Fragen zum Service haben, können Sie sich gerne an unseren Support wenden.</p>
    <form action="Support.php" method="post">
        <label for="Frage">Ihre Frage:</label>
        <textarea id="Frage" name="Frage" rows="4" cols="50" placeholder="Geben Sie hier Ihre Frage ein..." required></textarea><br><br>
        <label for="email">Ihre E-Mail-Adresse:</label>
        <input type="email" name="email" id="email" placeholder="Geben Sie Ihre E-Mail-Adresse ein..." required><br><br>
        <button  type="submit" required>Frage senden</button>
    </form>
</body>
</html>
